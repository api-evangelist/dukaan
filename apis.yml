aid: dukaan
name: Dukaan
description: >-
  Dukaan is an enterprise e-commerce platform, built by Growthpond Technology
  Private Limited (India), that lets businesses launch and run online stores
  without code. The platform bundles a store builder with curated themes,
  catalog and order management, pan-India logistics via Dukaan Delivery,
  payments, and an extendable plugin ecosystem. Dukaan's public developer
  surface is its Themes platform: a documented theming system (docs.mydukaan.io)
  built on HTML, CSS, JavaScript, and the Nunjucks templating language, with a
  "Dukaan Data" store-object model, "Dukaan Functions", and first-party plugins
  (wishlist, countdown timer, product scarcity). Dukaan does not publish a
  public REST/OpenAPI programmatic API; its extensibility is theme- and
  plugin-oriented rather than API-first. Added to the API Evangelist network
  from the Lightspeed Venture Partners portfolio.
